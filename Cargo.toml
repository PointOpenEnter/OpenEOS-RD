[package]
name = "openeos"
version = "1.0.3"
edition = "2021"
authors = ["OpenEOS Team"]
description = "Shutter-count analyzer for RAW/JPEG files with SD card preparation"

[[bin]]
name = "openeos"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["default_fonts", "glow"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
byteorder = "1.5"
rfd = "0.15"
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
